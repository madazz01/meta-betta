<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src __CSP_SOURCE__; script-src 'nonce-__NONCE__';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="__STYLE_URI__">
  <title>Meta Betta Chat</title>
</head>
<body>
  <main id="chat">
    <header id="topbar">
      <button id="session-label" class="label-btn" type="button" title="Rename this chat">…</button>
      <button id="skip-welcome" class="btn small" type="button" hidden>Skip</button>
    </header>
    <div id="goal" hidden></div>
    <div id="no-folder" hidden>
      <p>Open a folder to start</p>
      <button id="open-folder" class="btn" type="button">Open Folder…</button>
    </div>
    <div id="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>
    <p id="empty-state">Morning! What are we working on?</p>
    <div id="slash-menu" hidden></div>
    <div id="composer-wrap">
      <form id="composer">
        <textarea id="input" rows="2" placeholder="Type a message…" aria-label="Type a message"></textarea>
        <div id="strip" role="toolbar" aria-label="Chat actions">
          <div class="strip-fixed">
            <button id="save-day" class="fixed-btn" type="button" title="Save my day">Save</button>
            <button id="undo-last" class="fixed-btn" type="button" title="Undo the last change" disabled>↩ Undo</button>
            <button id="new-chat" class="fixed-btn" type="button" title="New chat in a new tab">New</button>
          </div>
          <span class="strip-divider" aria-hidden="true"></span>
          <div id="pills" aria-label="Your shortcuts"></div>
          <button id="approvals" class="pill" type="button" title="Ask: you approve each step. Auto: safe steps in this folder go through. All: run everything without asking.">Approvals: Auto ▾</button>
          <button id="effort" class="pill" type="button" title="How hard Muse thinks. Deep is slower and uses more credits.">Effort: Normal ▾</button>
          <button id="send" type="submit">Send</button>
        </div>
      </form>
      <div id="popup" hidden></div>
    </div>
    <p id="status" aria-live="polite"></p>
  </main>
  <script nonce="__NONCE__" src="__MARKDOWN_URI__"></script>
  <script nonce="__NONCE__" src="__STEPS_URI__"></script>
  <script nonce="__NONCE__" src="__SCRIPT_URI__"></script>
</body>
</html>
