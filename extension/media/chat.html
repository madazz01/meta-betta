<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src __CSP_SOURCE__; script-src 'nonce-__NONCE__';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="__STYLE_URI__">
  <title>Meta Betta Chat</title>
</head>
<body>
  <main id="chat">
    <header id="topbar">
      <button id="session-label" class="label-btn" type="button" title="Rename this chat">…</button>
      <button id="new-chat" class="btn small" type="button">New chat</button>
      <button id="save-day" class="btn small" type="button" title="Write what happened into the brain">💾 Save my day</button>
      <button id="undo-last" class="btn small" type="button" title="Nothing to undo" disabled>↩ Undo</button>
      <button id="skip-welcome" class="btn small" type="button" hidden>Skip</button>
    </header>
    <div id="goal" hidden></div>
    <div id="no-folder" hidden>
      <p>Open a folder to start</p>
      <button id="open-folder" class="btn" type="button">Open Folder…</button>
    </div>
    <div id="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>
    <p id="empty-state">Morning! What are we working on?</p>
    <div id="chips">
      <button class="chip" type="button" data-chip="goal" title="Pin a goal for this chat, with a progress bar">🎯 <span class="chip-label">Goal</span></button>
      <button class="chip" type="button" data-chip="side" title="Ask something off-topic without muddling the main job">💬 <span class="chip-label">Side question</span></button>
      <button class="chip" type="button" data-chip="fork" title="Try another way from here, keeping this chat">🔀 <span class="chip-label">Fork</span></button>
      <button class="chip" type="button" data-chip="usage" title="See what this chat is costing">📊 <span class="chip-label">Usage</span></button>
    </div>
    <div id="slash-menu" hidden></div>
    <div id="composer-wrap">
      <form id="composer">
        <textarea id="input" rows="2" placeholder="Type a message…" aria-label="Type a message"></textarea>
        <button id="effort" type="button" title="Thinking effort: Normal — click to change">⚡ Normal</button>
        <button id="send" type="submit">Send</button>
      </form>
    </div>
    <p id="status" aria-live="polite"></p>
  </main>
  <script nonce="__NONCE__" src="__MARKDOWN_URI__"></script>
  <script nonce="__NONCE__" src="__SCRIPT_URI__"></script>
</body>
</html>
